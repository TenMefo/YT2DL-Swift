name: Publish All-in-One 1.1
on:
  push:
    paths:
      - .github/workflows/publish-1.1.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YT2DL-All-in-One-Apple-Silicon
          run-id: 41252648650
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Publish verified standalone app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: TenMefo/YT2DL-Swift
        run: |
          cat > release-notes.md <<'NOTES'
          Native macOS 14+ app for Apple Silicon, with all required tools included.
          No Homebrew, Python, Terminal setup or separate backend required.
          Includes standalone yt-dlp, FFmpeg, FFprobe and Deno.
          Verified: unit tests, isolated PATH, MP3/Opus conversion, signatures and relocation.
          Unzip and move YT2DL.app to Applications. Ad-hoc signed; Apple notarization is not included.
          NOTES
          gh release create v1.1.0 dist/YT2DL-All-in-One-macOS.zip --target 88f41d828bb77e105cbdefabe9dfd7c70fc261d4 --title "YT2DL 1.1.0 — All-in-One" --notes-file release-notes.md
