name: macOS
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: swift test
      - name: Build application
        run: bash scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: YT2DL-macOS
          path: dist/YT2DL-macOS.zip
